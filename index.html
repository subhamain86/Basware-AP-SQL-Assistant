<style>
:root {
  --brand: #2f6fed; --brand-dark: #1c3f8f; --radius: 10px;
  --shadow-sm: 0 3px 7px rgba(20, 30, 70, .12); --shadow-md: 0 7px 18px rgba(20, 30, 70, .16); --shadow-lg: 0 14px 40px rgba(10,15,35,.35);
  --font: 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
}
[data-theme='light'] { --bg: #f4f6fb; --bg-card: #ffffff; --text: #1a2436; --text-muted: #5b6577; --border: #e1e6f0; --code-bg: #0f1830; --code-text: #cfe0ff; --hover: #eef2fb; --overlay: rgba(10,15,30,.5); }
[data-theme='dark'] { --bg: #0e1526; --bg-card: #161f36; --text: #eef2fb; --text-muted: #9aa7c2; --border: #263252; --code-bg: #0a1120; --code-text: #bcd4ff; --hover: #1c2745; --overlay: rgba(0,0,0,.65); }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; overflow-x: hidden; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
input, select, textarea, button { font-family: inherit; font-size: 14px; }
h1, h2, h3, h4 { margin: 0 0 .5rem 0; }
code { background: var(--hover); padding: .1rem .4rem; border-radius: 4px; }
.mt { margin-top: 1.1rem; }
.hint { color: var(--text-muted); font-size: 12px; }
.tiny-label { font-size: 11.5px; margin-bottom: .4rem; }
.app-shell { min-height: calc(100vh - 48px); display: flex; flex-direction: column; }
.app-main { flex: 1; max-width: 1280px; width: 100%; margin: 0 auto; padding: 1.5rem 1.25rem 3rem; }
.app-footer { display: flex; justify-content: space-between; align-items: center; padding: .85rem 1.5rem; border-top: 1px solid var(--border); color: var(--text-muted); font-size: 12.5px; }
.container-fluid { width: 100%; padding: 0 1.25rem; }
.navbar { position: sticky; top: 0; z-index: 1045; background: var(--bg-card); border-bottom: 1px solid var(--border); box-shadow: var(--shadow-sm); }
.navbar-inner { display: flex; align-items: center; justify-content: space-between; gap: .6rem; min-width: 0; padding: .55rem 1.25rem; flex-wrap: nowrap; }
.navbar-left-cluster { display: flex; align-items: center; gap: .7rem; flex: 0 0 auto; min-width: 0; }
.hero-brand-row { display: flex; align-items: center; gap: .6rem; min-width: 0; overflow: hidden; background: none; border: none; padding: .3rem .4rem; border-radius: 10px; cursor: pointer; }
.hero-brand-row:hover { background: rgba(47,111,237,.06); }
.app-logo-badge { flex: 0 0 auto; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
.logo-mark-svg { display: block; width: 100%; height: 100%; }
.brand-text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; text-align: left; }
.builder-heading { font-weight: 700; font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
.brand-text .small { font-size: 11.5px; color: var(--text-muted); }
.navbar-sync-cluster { display: flex; align-items: center; gap: .4rem; flex: 1 1 auto; justify-content: center; min-width: 0; }
.sync-dropdown-wrap { position: relative; }
.sync-dropdown-btn { display: flex; align-items: center; gap: .35rem; background: var(--hover); border: 1px solid var(--border); border-radius: 999px; padding: .4rem .7rem; font-size: 12.5px; font-weight: 600; color: var(--text); white-space: nowrap; }
.sync-dropdown-menu { position: absolute; left: 0; top: calc(100% + 6px); background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-md); padding: .3rem; display: flex; flex-direction: column; min-width: 190px; z-index: 1060; max-height: 260px; overflow-y: auto; }
.sync-dropdown-menu[hidden] { display: none; }
.sync-dropdown-menu button { display: flex; align-items: center; gap: .5rem; padding: .5rem .6rem; background: none; border: none; border-radius: 7px; color: var(--text); text-align: left; font-size: 13px; white-space: nowrap; }
.sync-dropdown-menu button:hover { background: var(--hover); }
.conflict-nav-badge { display: inline-flex; align-items: center; gap: .3rem; background: rgba(230,170,50,.18); color: #b3820f; border-radius: 999px; padding: .3rem .6rem; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
.navbar-right-cluster { display: flex; align-items: center; gap: .5rem; flex: 0 1 auto; min-width: 0; }
.schema-badge { display: inline-flex; align-items: center; gap: .35rem; background: var(--hover); border: 1px solid var(--border); border-radius: 999px; padding: .3rem .65rem; font-size: 12px; font-weight: 600; color: var(--brand); white-space: nowrap; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
.net-status-badge { display: inline-flex; align-items: center; padding: .35rem; border-radius: 999px; background: var(--hover); color: var(--text-muted); }
.settings-lock-badge { display: inline-flex; align-items: center; padding: .35rem; border-radius: 999px; background: rgba(214,69,80,.12); color: #d64550; }
.settings-lock-badge.is-unlocked { background: rgba(70,180,120,.15); color: #2f9e5b; }
.navbar-toggler { flex: 0 0 auto; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); }
.navbar-toggler:hover { background-color: rgba(47,111,237,.10); }
.navbar-tour-btn { white-space: nowrap; }
.navbar-signature { display: inline-flex; align-items: center; gap: .3rem; font-size: 12.5px; font-weight: 600; color: var(--text-muted); white-space: nowrap; padding: .3rem .5rem; }
.theme-toggle-wrap { position: relative; }
.theme-menu { position: absolute; right: 0; top: calc(100% + 8px); background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-md); padding: .35rem; display: flex; flex-direction: column; min-width: 170px; z-index: 1050; }
.theme-menu[hidden] { display: none; }
.theme-menu button { display: flex; align-items: center; gap: .5rem; padding: .5rem .6rem; background: none; border: none; border-radius: 7px; color: var(--text); text-align: left; font-size: 13px; }
.theme-menu button:hover { background: var(--hover); }
.hamburger-overlay { position: fixed; inset: 0; z-index: 1100; background: var(--overlay); display: flex; justify-content: flex-start; opacity: 0; pointer-events: none; transition: opacity .18s ease; }
.hamburger-overlay.open { opacity: 1; pointer-events: auto; }
.hamburger-panel { width: min(340px, 88vw); max-width: 100%; height: 100%; background: var(--bg-card); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; overflow: hidden; }
.hamburger-panel-header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.1rem; border-bottom: 1px solid var(--border); flex: 0 0 auto; }
.hamburger-panel-title { display: flex; align-items: center; gap: .5rem; font-weight: 700; font-size: 15px; }
.hamburger-panel-body { flex: 1; overflow-y: auto; padding: .6rem; display: flex; flex-direction: column; gap: .2rem; }
.hb-link { display: flex; align-items: center; gap: .7rem; padding: .65rem .75rem; border-radius: 9px; color: var(--text); font-size: 14px; font-weight: 600; background: none; border: none; text-align: left; width: 100%; }
.hb-link:hover { background: var(--hover); }
.hb-link.active { background: rgba(47,111,237,.14); color: var(--brand); }
.hb-lock-icon { margin-left: auto; opacity: .6; }
.hb-link-child { font-weight: 500; font-size: 13.5px; padding-left: 1.1rem; }
.hb-group-toggle { display: flex; align-items: center; justify-content: space-between; gap: .5rem; width: 100%; padding: .65rem .75rem; border-radius: 9px; background: none; border: none; color: var(--text); font-size: 14px; font-weight: 600; text-align: left; cursor: pointer; }
.hb-group-toggle:hover { background: var(--hover); }
.hb-group-toggle.active { color: var(--brand); }
.hb-group-toggle-main { display: flex; align-items: center; gap: .7rem; flex: 1; pointer-events: none; }
.hb-group-chevron { display: flex; align-items: center; pointer-events: none; }
.hb-group-toggle .icon-svg.rotated { transform: rotate(180deg); }
.hb-group-children { display: flex; flex-direction: column; gap: .1rem; padding: .2rem 0 .3rem .6rem; border-left: 2px solid var(--border); margin-left: 1.1rem; }
.hb-group-children[hidden] { display: none; }
.hb-divider { height: 1px; background: var(--border); margin: .5rem .2rem; }
.hb-tour-btn { color: var(--brand); }
.hb-signature { display: flex; align-items: center; gap: .4rem; padding: .5rem .75rem; color: var(--text-muted); font-size: 12.5px; font-weight: 600; }
.hb-mobile-sync-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: .3rem; }
.hb-mobile-sync-select { width: 100%; margin-bottom: .5rem; }
.btn { border-radius: 9px; padding: .5rem .9rem; font-weight: 600; font-size: 13.5px; border: 1px solid transparent; display: inline-flex; align-items: center; gap: .4rem; }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--brand); color: #fff; box-shadow: 0 3px 8px rgba(47,111,237,.35); }
.btn-outline { background: transparent; border-color: var(--border); color: var(--text); }
.btn-outline:hover { background: var(--hover); }
.btn-ghost { background: transparent; color: var(--text-muted); }
.btn-ghost:hover { color: var(--text); }
.btn-danger { background: #d64550; color: #fff; }
.btn-sm { padding: .4rem .65rem; font-size: 12.5px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-link { background: none; border: none; color: var(--brand); font-weight: 600; font-size: 12.5px; padding: 0; }
.file-input-label { cursor: pointer; position: relative; }
.icon-btn { background: transparent; border: none; color: var(--text-muted); border-radius: 7px; padding: .3rem; display: flex; }
.icon-btn:hover { background: var(--hover); color: #d64550; }
.icon-svg { display: block; }
.page { animation: fadeIn .18s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.page-title { display: flex; align-items: center; gap: .5rem; font-size: 22px; }
.page-subtitle { color: var(--text-muted); margin-top: -.25rem; margin-bottom: 1.25rem; font-size: 14px; }
.section-title { display: flex; align-items: center; gap: .5rem; font-size: 16px; margin-top: 2rem; }
.hero-card { background: linear-gradient(135deg, rgba(47,111,237,.1), rgba(28,63,143,.05)); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem 1.75rem; }
.hero-card h1 { font-size: 24px; }
.hero-card .lead { color: var(--text-muted); line-height: 1.6; margin: 0; }
.chip-row { display: flex; flex-wrap: wrap; gap: .5rem; margin: .75rem 0 0; }
.chip { background: var(--bg-card); border: 1px solid var(--border); border-radius: 999px; padding: .3rem .75rem; font-size: 12.5px; font-weight: 600; color: var(--brand); }
.chip-pk { background: rgba(47,111,237,.15); color: var(--brand); border: none; }
.chip-fk { background: rgba(214,69,80,.12); color: #d64550; border: none; margin-left: .3rem; font-size: 11px; }
.chip-active, .chip-default { background: rgba(70,180,120,.15); color: #2f9e5b; border: none; }
.chip-inactive { background: var(--hover); color: var(--text-muted); border: none; }
.chip-view { display: inline-flex; align-items: center; gap: .2rem; background: rgba(154,103,247,.15); color: #7c4fe0; border: none; font-size: 10px; padding: .1rem .4rem; vertical-align: middle; }
.card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1rem; margin-top: .75rem; }
.feature-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem; cursor: pointer; }
.feature-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
.feature-icon { width: 42px; height: 42px; border-radius: 11px; background: rgba(47,111,237,.12); color: var(--brand); display: flex; align-items: center; justify-content: center; margin-bottom: .6rem; }
.feature-card h3 { font-size: 15px; }
.feature-card p { color: var(--text-muted); font-size: 13px; line-height: 1.5; min-height: 55px; }
.card-link { color: var(--brand); font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: .25rem; }
.badge { background: var(--brand); color: #fff; font-size: 10.5px; padding: .1rem .4rem; border-radius: 6px; vertical-align: middle; }
.engine-badge { display: inline-flex; align-items: center; gap: .35rem; padding: .25rem .6rem; border-radius: 999px; font-size: 11.5px; font-weight: 700; margin-bottom: .5rem; }
.engine-online { background: rgba(47,111,237,.15); color: var(--brand); }
.engine-offline { background: rgba(230,170,50,.15); color: #b3820f; }
.schema-audit-line { display: flex; align-items: center; gap: .35rem; font-size: 11.5px; color: var(--text-muted); margin-bottom: .5rem; }
.note-box, .issue-box, .tips-box, .explanation-box, .notes-box { display: flex; gap: .6rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: .85rem 1rem; margin-top: 1.25rem; font-size: 13.5px; align-items: flex-start; }
.issue-box { border-color: rgba(214,69,80,.35); color: #d64550; }
.issue-box.warn { border-color: rgba(230,170,50,.4); color: #b3820f; }
.issue-box ul, .tips-box ul, .notes-box ul { margin: 0; padding-left: 1.1rem; }
.issue-box.mini, .tips-box.mini { padding: .5rem .7rem; font-size: 12.5px; flex-direction: column; }
.issue-box.ok { border-color: rgba(70,180,120,.4); color: #2f9e5b; }
.explanation-box { display: block; color: var(--text); }
.plan-list { padding-left: 1.2rem; }
.builder-grid-top { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; align-items: start; margin-top: .5rem; }
.builder-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem; }
.builder-panel.narrow { max-width: 480px; }
.builder-panel h2 { font-size: 14px; margin-top: 1.1rem; display: flex; align-items: center; gap: .4rem; }
.builder-panel h2:first-child { margin-top: 0; }
.manual-selectors-panel { margin-top: 1.25rem; }
.build-query-row { justify-content: flex-start; align-items: center; border-top: 1px solid var(--border); padding-top: 1rem; margin-top: 1.25rem !important; }
textarea, input[type='text'], input[type='number'], input[type='password'], input[type='file'], input[type='time'], select { width: 100%; padding: .55rem .65rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); resize: vertical; }
textarea:focus, input:focus, select:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
.block-label { display: flex; flex-direction: column; gap: .3rem; font-size: 13px; font-weight: 600; margin-top: .6rem; }
.inline-label { display: flex; align-items: center; gap: .5rem; font-size: 13px; font-weight: 600; margin: .5rem 0; }
.inline-label select { width: auto; }
.inline-check { display: flex; align-items: center; gap: .4rem; font-size: 13px; margin-top: .5rem; }
.inline-check input { width: auto; }
.row-actions { display: flex; gap: .6rem; margin-top: .75rem; align-items: center; flex-wrap: wrap; }
.row-actions.wrap { flex-wrap: wrap; }
.row-actions[hidden] { display: none; }
.mini-row { display: flex; align-items: center; gap: .4rem; background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: .45rem .5rem; }
.mini-row.wrap { flex-wrap: wrap; }
.mini-row select, .mini-row input { width: auto; flex: 1 1 auto; min-width: 90px; }
.segmented { display: flex; gap: .4rem; margin: .4rem 0 .6rem; }
.seg-btn { flex: 1; padding: .5rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text-muted); font-weight: 700; font-size: 13px; }
.seg-btn.active { background: var(--brand); border-color: var(--brand); color: #fff; }
