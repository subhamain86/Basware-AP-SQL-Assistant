:root {
--brand: #2f6fed; --brand-dark: #1c3f8f; --radius: 10px;
--shadow-sm: 0 3px 7px rgba(20, 30, 70, .12); --shadow-md: 0 7px 18px rgba(20, 30, 70, .16); --shadow-lg: 0 14px 40px rgba(10,15,35,.35);
--font: 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
}
[data-theme='light'] { --bg: #f4f6fb; --bg-card: #ffffff; --text: #1a2436; --text-muted: #5b6577; --border: #e1e6f0; --code-bg: #0f1830; --code-text: #cfe0ff; --hover: #eef2fb; --overlay: rgba(10,15,30,.5); }
[data-theme='dark'] { --bg: #0e1526; --bg-card: #161f36; --text: #eef2fb; --text-muted: #9aa7c2; --border: #263252; --code-bg: #0a1120; --code-text: #bcd4ff; --hover: #1c2745; --overlay: rgba(0,0,0,.65); }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; overflow-x: hidden; }
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }

.app-shell { min-height: calc(100vh - 48px); display: flex; flex-direction: column; }

.container-fluid { width: 100%; padding: 0 1.25rem; }
.navbar { position: sticky; top: 0; z-index: 1045; background: var(--bg-card); border-bottom: 1px solid var(--border); box-shadow: var(--shadow-sm); }

.hero-brand-row:hover { background: rgba(47,111,237,.06); }

.brand-text { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; text-align: left; }

.brand-text .small { font-size: 11.5px; color: var(--text-muted); }

.sync-dropdown-wrap { position: relative; }
.sync-dropdown-btn { display: flex; align-items: center; gap: .35rem; background: var(--hover); border: 1px solid var(--border); border-radius: 999px; padding: .4rem .7rem; font-size: 12.5px; font-weight: 600; color: var(--text); white-space: nowrap; }
.sync-dropdown-menu { position: absolute; left: 0; top: calc(100% + 6px); background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-md); padding: .3rem; display: flex; flex-direction: column; min-width: 190px; z-index: 1060; max-height: 260px; overflow-y: auto; }
.sync-dropdown-menu[hidden] { display: none; }
.sync-dropdown-menu button { display: flex; align-items: center; gap: .5rem; padding: .5rem .6rem; background: none; border: none; border-radius: 7px; color: var(--text); text-align: left; font-size: 13px; white-space: nowrap; }
.sync-dropdown-menu button:hover { background: var(--hover); }
.conflict-nav-badge { display: inline-flex; align-items: center; gap: .3rem; background: rgba(230,170,50,.18); color: #b3820f; border-radius: 999px; padding: .3rem .6rem; font-size: 11.5px; font-weight: 700; white-space: nowrap; }
.navbar-right-cluster { display: flex; align-items: center; gap: .5rem; flex: 0 1 auto; min-width: 0; }
.schema-badge { display: inline-flex; align-items: center; gap: .35rem; background: var(--hover); border: 1px solid var(--border); border-radius: 999px; padding: .3rem .65rem; font-size: 12px; font-weight: 600; color: var(--brand); white-space: nowrap; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
.net-status-badge { display: inline-flex; align-items: center; padding: .35rem; border-radius: 999px; background: var(--hover); color: var(--text-muted); }
.settings-lock-badge { display: inline-flex; align-items: center; padding: .35rem; border-radius: 999px; background: rgba(214,69,80,.12); color: #d64550; }
.settings-lock-badge.is-unlocked { background: rgba(70,180,120,.15); color: #2f9e5b; }
.navbar-toggler { flex: 0 0 auto; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; background: transparent; border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); }
.navbar-toggler:hover { background-color: rgba(47,111,237,.10); }
.navbar-tour-btn { white-space: nowrap; }
.navbar-signature { display: inline-flex; align-items: center; gap: .3rem; font-size: 12.5px; font-weight: 600; color: var(--text-muted); white-space: nowrap; padding: .3rem .5rem; }
.theme-toggle-wrap { position: relative; }
.theme-menu { position: absolute; right: 0; top: calc(100% + 8px); background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow-md); padding: .35rem; display: flex; flex-direction: column; min-width: 170px; z-index: 1050; }
.theme-menu[hidden] { display: none; }
.theme-menu button { display: flex; align-items: center; gap: .5rem; padding: .5rem .6rem; background: none; border: none; border-radius: 7px; color: var(--text); text-align: left; font-size: 13px; }
.theme-menu button:hover { background: var(--hover); }
.hamburger-overlay { position: fixed; inset: 0; z-index: 1100; background: var(--overlay); display: flex; justify-content: flex-start; opacity: 0; pointer-events: none; transition: opacity .18s ease; }
.hamburger-overlay.open { opacity: 1; pointer-events: auto; }
.hamburger-panel { width: min(340px, 88vw); max-width: 100%; height: 100%; background: var(--bg-card); box-shadow: var(--shadow-lg); display: flex; flex-direction: column; overflow: hidden; }
.hamburger-panel-header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.1rem; border-bottom: 1px solid var(--border); flex: 0 0 auto; }
.hamburger-panel-title { display: flex; align-items: center; gap: .5rem; font-weight: 700; font-size: 15px; }
.hamburger-panel-body { flex: 1; overflow-y: auto; padding: .6rem; display: flex; flex-direction: column; gap: .2rem; }
.hb-link { display: flex; align-items: center; gap: .7rem; padding: .65rem .75rem; border-radius: 9px; color: var(--text); font-size: 14px; font-weight: 600; background: none; border: none; text-align: left; width: 100%; }
.hb-link:hover { background: var(--hover); }
.hb-link.active { background: rgba(47,111,237,.14); color: var(--brand); }
.hb-lock-icon { margin-left: auto; opacity: .6; }
.hb-link-child { font-weight: 500; font-size: 13.5px; padding-left: 1.1rem; }
.hb-group-toggle { display: flex; align-items: center; justify-content: space-between; gap: .5rem; width: 100%; padding: .65rem .75rem; border-radius: 9px; background: none; border: none; color: var(--text); font-size: 14px; font-weight: 600; text-align: left; cursor: pointer; }
.hb-group-toggle:hover { background: var(--hover); }
.hb-group-toggle.active { color: var(--brand); }
.hb-group-toggle-main { display: flex; align-items: center; gap: .7rem; flex: 1; pointer-events: none; }
.hb-group-chevron { display: flex; align-items: center; pointer-events: none; }
.hb-group-toggle .icon-svg.rotated { transform: rotate(180deg); }
.hb-group-children { display: flex; flex-direction: column; gap: .1rem; padding: .2rem 0 .3rem .6rem; border-left: 2px solid var(--border); margin-left: 1.1rem; }
.hb-group-children[hidden] { display: none; }
.hb-divider { height: 1px; background: var(--border); margin: .5rem .2rem; }
.hb-tour-btn { color: var(--brand); }
.hb-signature { display: flex; align-items: center; gap: .4rem; padding: .5rem .75rem; color: var(--text-muted); font-size: 12.5px; font-weight: 600; }
.hb-mobile-sync-label { display: block; font-size: 12px; font-weight: 600; color: var(--text-muted); margin-bottom: .3rem; }
.hb-mobile-sync-select { width: 100%; margin-bottom: .5rem; }
.btn { border-radius: 9px; padding: .5rem .9rem; font-weight: 600; font-size: 13.5px; border: 1px solid transparent; display: inline-flex; align-items: center; gap: .4rem; }
.btn:active { transform: scale(.97); }
.btn-primary { background: var(--brand); color: #fff; box-shadow: 0 3px 8px rgba(47,111,237,.35); }
.btn-outline { background: transparent; border-color: var(--border); color: var(--text); }
.btn-outline:hover { background: var(--hover); }
.btn-ghost { background: transparent; color: var(--text-muted); }
.btn-ghost:hover { color: var(--text); }
.btn-danger { background: #d64550; color: #fff; }
.btn-sm { padding: .4rem .65rem; font-size: 12.5px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-link { background: none; border: none; color: var(--brand); font-weight: 600; font-size: 12.5px; padding: 0; }
.file-input-label { cursor: pointer; position: relative; }
.icon-btn { background: transparent; border: none; color: var(--text-muted); border-radius: 7px; padding: .3rem; display: flex; }
.icon-btn:hover { background: var(--hover); color: #d64550; }
.icon-svg { display: block; }
.page { animation: fadeIn .18s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.page-title { display: flex; align-items: center; gap: .5rem; font-size: 22px; }
.page-subtitle { color: var(--text-muted); margin-top: -.25rem; margin-bottom: 1.25rem; font-size: 14px; }
.section-title { display: flex; align-items: center; gap: .5rem; font-size: 16px; margin-top: 2rem; }
.hero-card { background: linear-gradient(135deg, rgba(47,111,237,.1), rgba(28,63,143,.05)); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem 1.75rem; }
.hero-card h1 { font-size: 24px; }
.hero-card .lead { color: var(--text-muted); line-height: 1.6; margin: 0; }
.chip-row { display: flex; flex-wrap: wrap; gap: .5rem; margin: .75rem 0 0; }
.chip { background: var(--bg-card); border: 1px solid var(--border); border-radius: 999px; padding: .3rem .75rem; font-size: 12.5px; font-weight: 600; color: var(--brand); }
.chip-pk { background: rgba(47,111,237,.15); color: var(--brand); border: none; }
.chip-fk { background: rgba(214,69,80,.12); color: #d64550; border: none; margin-left: .3rem; font-size: 11px; }
.chip-active, .chip-default { background: rgba(70,180,120,.15); color: #2f9e5b; border: none; }
.chip-inactive { background: var(--hover); color: var(--text-muted); border: none; }
.chip-view { display: inline-flex; align-items: center; gap: .2rem; background: rgba(154,103,247,.15); color: #7c4fe0; border: none; font-size: 10px; padding: .1rem .4rem; vertical-align: middle; }
.card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1rem; margin-top: .75rem; }
.feature-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 1.1rem; cursor: pointer; }
.feature-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); }
.feature-icon { width: 42px; height: 42px; border-radius: 11px; background: rgba(47,111,237,.12); color: var(--brand); display: flex; align-items: center; justify-content: center; margin-bottom: .6rem; }
.feature-card h3 { font-size: 15px; }
.feature-card p { color: var(--text-muted); font-size: 13px; line-height: 1.5; min-height: 55px; }
.card-link { color: var(--brand); font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: .25rem; }
.badge { background: var(--brand); color: #fff; font-size: 10.5px; padding: .1rem .4rem; border-radius: 6px; vertical-align: middle; }
.engine-badge { display: inline-flex; align-items: center; gap: .35rem; padding: .25rem .6rem; border-radius: 999px; font-size: 11.5px; font-weight: 700; margin-bottom: .5rem; }
.engine-online { background: rgba(47,111,237,.15); color: var(--brand); }
.engine-offline { background: rgba(230,170,50,.15); color: #b3820f; }
.schema-audit-line { display: flex; align-items: center; gap: .35rem; font-size: 11.5px; color: var(--text-muted); margin-bottom: .5rem; }
.note-box, .issue-box, .tips-box, .explanation-box, .notes-box { display: flex; gap: .6rem; background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px; padding: .85rem 1rem; margin-top: 1.25rem; font-size: 13.5px; align-items: flex-start; }
.issue-box { border-color: rgba(214,69,80,.35); color: #d64550; }
.issue-box.warn { border-color: rgba(230,170,50,.4); color: #b3820f; }
.issue-box ul, .tips-box ul, .notes-box ul { margin: 0; padding-left: 1.1rem; }
.issue-box.mini, .tips-box.mini { padding: .5rem .7rem; font-size: 12.5px; flex-direction: column; }
.issue-box.ok { border-color: rgba(70,180,120,.4); color: #2f9e5b; }
.explanation-box { display: block; color: var(--text); }
.plan-list { padding-left: 1.2rem; }
/* Card-sizing fix: BOTH cards inside .builder-grid-top share the plain
   .builder-panel class with NO width-restricting modifier. A previous
   ".narrow" modifier capping the left card at max-width:480px while sitting
   in an equal 1fr/1fr grid — causing it to render visibly smaller/uneven
   next to the right card — has been permanently removed. Both cards now
   stretch equally to their 1fr grid column, restoring symmetric card
   proportions. Padding, radius, shadow, and every other card property below
   are otherwise unchanged. */
.builder-grid-top { display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem; align-items: start; margin-top: .5rem; }
.builder-panel { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 1.25rem; }
.builder-panel h2 { font-size: 14px; margin-top: 1.1rem; display: flex; align-items: center; gap: .4rem; }
.builder-panel h2:first-child { margin-top: 0; }
.manual-selectors-panel { margin-top: 1.25rem; }
.build-query-row { justify-content: flex-start; align-items: center; border-top: 1px solid var(--border); padding-top: 1rem; margin-top: 1.25rem !important; }
textarea, input[type='text'], input[type='number'], input[type='password'], input[type='file'], input[type='time'], select { width: 100%; padding: .55rem .65rem; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); resize: vertical; }
textarea:focus, input:focus, select:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
.block-label { display: flex; flex-direction: column; gap: .3rem; font-size: 13px; font-weight: 600; margin-top: .6rem; }
.inline-label { display: flex; align-items: center; gap: .5rem; font-size: 13px; font-weight: 600; margin: .5rem 0; }
.inline-label select { width: auto; }
.inline-check { display: flex; align-items: center; gap: .4rem; font-size: 13px; margin-top: .5rem; }
.inline-check input { width: auto; }
.row-actions { display: flex; gap: .6rem; margin-top: .75rem; align-items: center; flex-wrap: wrap; }
.row-actions.wrap { flex-wrap: wrap; }
.row-actions[hidden] { display: none; }
.mini-row { display: flex; align-items: center; gap: .4rem; background: var(--bg); border: 1px solid var(--border); border-radius: 9px; padding: .45rem .5rem; }
.mini-row.wrap { flex-wrap: wrap; }
.mini-row select, .mini-row input { width: auto; flex: 1 1 auto; min-width: 90px; }
.segmented { display: flex; gap: .4rem; margin: .4rem 0 .6rem; }

  var RESERVED_WORDS = /* @__PURE__ */ new Set(["select", "from", "where", "group", "order", "having", "join", "on", "and", "or", "not", "null", "as", "distinct", "case", "when", "then", "else", "end", "with", "union", "insert", "update", "delete", "table", "view"]);
  function validateAlias(alias) {
    const trimmed = alias.trim();
    if (trimmed === "") return { valid: true };
    if (!/^[A-Za-z_][A-Za-z0-9_]*$/.test(trimmed)) return { valid: false, message: "Alias must start with a letter or underscore, and contain only letters, digits, and underscores (no spaces or symbols)." };
    if (RESERVED_WORDS.has(trimmed.toLowerCase())) return { valid: false, message: `"${trimmed}" is a reserved SQL keyword and cannot be used as an alias.` };
    return { valid: true };
  }

  function renderColumnPicker(container, schema, selectedTables, selectedColumns, callbacks) {
    let searchTerm = "";
    let current = [...selectedColumns];
    function realColumnsInScope() {
      return selectedTables.flatMap((tableName) => {
        const table = schema.tables.find((t) => t.name === tableName);
        return table ? table.columns.map((c) => ({ table: tableName, column: c })) : [];
      });
    }
    function isSelected(table, column) {
      return current.some((c) => c.table === table && c.column === column && !c.manualExpr);
    }
    function selectedSpec(table, column) {
      return current.find((c) => c.table === table && c.column === column && !c.manualExpr);
    }
    function allRealColumnsSelected() {
      const scope = realColumnsInScope();
      if (scope.length === 0) return false;
      return scope.every((ref) => isSelected(ref.table, ref.column.name));
    }
    function renderColumnRow(tableName, c) {
      const spec = selectedSpec(tableName, c.name);
      const selected = !!spec;
      const hasSchemaDecode = !!c.decode?.length;
      const mode = spec?.displayMode ?? "raw";
      const controlsHtml = selected ? `<div class="column-row-controls"><label class="column-inline-label">Alias<input type="text" class="column-alias-input" value="${(spec.alias || "").replace(/"/g, "&quot;")}"/></label><label class="column-inline-label">Display as<select class="column-mode-select"><option value="raw" ${mode === "raw" ? "selected" : ""}>Column</option>${hasSchemaDecode ? `<option value="schema-decode" ${mode === "schema-decode" ? "selected" : ""}>Schema DECODE</option>` : ""}<option value="manual-decode">Manual DECODE\u2026</option></select></label></div><div class="column-alias-error"></div>` : "";
      return `<div class="column-row ${selected ? "is-selected" : ""}" data-table="${tableName}" data-column="${c.name}"><label class="column-row-checkbox-label"><input type="checkbox" class="column-checkbox" ${selected ? "checked" : ""}/><span><strong>${c.name}</strong> <span class="hint">${c.type}${c.length ? `(${c.length})` : ""}${c.isPrimaryKey ? " \xB7 PK" : ""}${c.isForeignKey ? " \xB7 FK" : ""}</span></span></label>${controlsHtml}</div>`;
    }
    function renderListOnly() {
      const listEl = container.querySelector(".picker-list");

        listEl.innerHTML = '<p class="hint">Select one or more tables first.</p>';
        if (countEl) countEl.textContent = "";
        if (selectAllCheckbox) {
          selectAllCheckbox.checked = false;
          selectAllCheckbox.disabled = true;
        }
        return;
      }
      if (selectAllCheckbox) {
        selectAllCheckbox.disabled = false;
        selectAllCheckbox.checked = allRealColumnsSelected();
      }
      const term = searchTerm.toLowerCase();
      listEl.innerHTML = selectedTables.map((tableName) => {
        const table = schema.tables.find((t) => t.name === tableName);
        if (!table) return "";
        const cols = table.columns.filter((c) => !term || c.name.toLowerCase().includes(term) || c.label.toLowerCase().includes(term));

        const rowsHtml = cols.map((c) => renderColumnRow(tableName, c)).join("");

    function wireRowListeners() {
      container.querySelectorAll(".column-row").forEach((row) => {
        const t = row.getAttribute("data-table");
        const cName = row.getAttribute("data-column");
        const colDef = schema.tables.find((tb) => tb.name === t)?.columns.find((cd) => cd.name === cName);
        if (!colDef) return;
        row.querySelector(".column-checkbox")?.addEventListener("click", (e) => {
          e.stopPropagation();
          if (isSelected(t, cName)) current = current.filter((x) => !(x.table === t && x.column === cName && !x.manualExpr));
          else current = [...current, { id: makeId("col"), table: t, column: cName, alias: "", useDecode: false, aggregate: null, displayMode: "raw" }];

          if (validation.valid) {
            spec.alias = value.trim();
            callbacks.onChange([...current]);
          }
        });
        row.querySelector(".column-mode-select")?.addEventListener("change", (e) => {
          const value = e.target.value;
          const spec = selectedSpec(t, cName);
          if (!spec) return;
          if (value === "manual-decode") {
            callbacks.onRequestManualDecodeForColumn(t, colDef, spec.id);

          callbacks.onChange([...current]);

    function toggleSelectAll(checked) {

          if (!isSelected(ref.table, ref.column.name)) current.push({ id: makeId("col"), table: ref.table, column: ref.column.name, alias: "", useDecode: false, aggregate: null, displayMode: "raw" });
        });
      } else {
        const scopeTableSet = new Set(selectedTables);
        current = current.filter((c) => c.manualExpr || !scopeTableSet.has(c.table));
      }
      callbacks.onChange([...current]);
      renderListOnly();
    }
    function renderShellOnce() {
      container.innerHTML = `<div class="picker"><div class="picker-search">${icon("search", 14)}<input type="text" class="picker-search-input" placeholder="Search columns"/></div><label class="select-all-row"><input type="checkbox" class="select-all-checkbox"/> ${icon("checkbox-checked", 14)} Select All (all columns for the selected table(s) \u2014 search only filters what's shown)</label><div class="picker-actions"><button type="button" class="btn btn-link" data-action="clear">Clear</button><span class="picker-count"></span></div><div class="picker-list"></div></div>`;

        current = current.filter((c) => c.manualExpr);
        callbacks.onChange([...current]);
        renderListOnly();
      });
      renderListOnly();
    }
    renderShellOnce();
    container._refreshList = renderListOnly;
  }

  // src/utils/dom.ts
  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function downloadBlob(filename, content, mime) {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }
  function trapFocus(container) {
    function onKey(e) {
      if (e.key !== "Tab") return;
      const focusables = Array.from(container.querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')).filter((el) => !el.hasAttribute("disabled"));
      if (focusables.length === 0) return;
      const first = focusables[0];
      const last = focusables[focusables.length - 1];
      if (e.shiftKey && document.activeElement === first) {
        e.preventDefault();
        last.focus();
      } else if (!e.shiftKey && document.activeElement === last) {
        e.preventDefault();
        first.focus();
      }
    }
    container.addEventListener("keydown", onKey);
    return () => container.removeEventListener("keydown", onKey);
  }
  function formatBytes(bytes) {
    if (bytes < 1024) return `${bytes} B`;
    if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
    return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
  }

      return { result: offlineResult, engineUsed: "offline", onlineAttempted: false, onlineError: availability.reason };
    }
    if (!rawText.trim()) return { result: offlineResult, engineUsed: "offline", onlineAttempted: false };
    if (!isBrowserOnline()) return { result: offlineResult, engineUsed: "offline", onlineAttempted: false, onlineError: "Browser reports offline." };
    const enterprise = await tryEnterpriseNlp(rawText, schema);
    if (!enterprise) return { result: offlineResult, engineUsed: "offline", onlineAttempted: true, onlineError: "No online AI/NLP endpoint configured or reachable." };
    const { response: online, source } = enterprise;
    const { known: knownTables, unknown: unknownTables } = filterToKnownTables(online.tables || [], schema);
    const onlineColumnPairs = (online.columns || []).map((c) => ({ table: c.table, column: c.column }));
    const { unknown: unknownColumns } = filterToKnownColumns(onlineColumnPairs, schema);
    const engineLabel = source === "copilot" ? "M365 Copilot Enterprise" : "generic Online AI/NLP Endpoint";
    const notes = [...offlineResult.notes, `Active Schema used for this request: "${schema.name}" (v${schema.versionMeta?.version ?? schema.version}) \u2014 schema-validated ${engineLabel} response.`];
    if (unknownTables.length) notes.push(`${engineLabel} referenced table(s) not present in the Active Schema and they were discarded: ${unknownTables.join(", ")}.`);
    if (unknownColumns.length) notes.push(`${engineLabel} referenced column(s) not present in the Active Schema and they were discarded: ${unknownColumns.map((c) => `${c.table}.${c.column}`).join(", ")}.`);
    const merged = { ...offlineResult, matchedTables: knownTables.length ? knownTables : offlineResult.matchedTables, notes, unresolvedTerms: [...offlineResult.unresolvedTerms, ...unknownTables, ...unknownColumns.map((c) => `${c.table}.${c.column}`)] };
    return { result: merged, engineUsed: source, onlineAttempted: true };
  }
  async function orchestrateCrNlp(rawText, schema) {
    const availability = validateActiveSchemaAvailability(schema);
    const offlineResult = parseCrRequirement(rawText, schema);
    if (!availability.available) {
      offlineResult.notes.unshift(`Active Schema unavailable: ${availability.reason}`);
      return { result: offlineResult, engineUsed: "offline", onlineAttempted: false, onlineError: availability.reason };
    }
    if (!rawText.trim()) return { result: offlineResult, engineUsed: "offline", onlineAttempted: false };
    if (!isBrowserOnline()) return { result: offlineResult, engineUsed: "offline", onlineAttempted: false, onlineError: "Browser reports offline." };
    const enterprise = await tryEnterpriseNlp(rawText, schema);
    if (!enterprise) return { result: offlineResult, engineUsed: "offline", onlineAttempted: true, onlineError: "No online AI/NLP endpoint configured or reachable." };
    return { result: offlineResult, engineUsed: enterprise.source, onlineAttempted: true };
  }

  // src/services/autoSyncService.ts
  var PUSH_DEBOUNCE_MS = 1200;
  var pushTimer = null;
  var initialized = false;
  var lastLockedWarningAt = 0;
  var toastFn = () => {
  };
  function setAutoSyncToastHandler(fn) {
    toastFn = fn;
  }
  function scheduleBackgroundPush() {
    if (isInternalSyncInProgress()) return;
    if (!secretVaultService.isUnlocked()) {
      const now = Date.now();
      if (now - lastLockedWarningAt > 15e3) {
        lastLockedWarningAt = now;
        toastFn("warning", "Schema saved locally, but NOT synchronized \u2014 unlock Settings (Admin Password) on this device to publish it to other devices.");
      }
      return;
    }
    if (pushTimer) clearTimeout(pushTimer);
    pushTimer = setTimeout(async () => {
      const result = await syncService.pushRegistryToGitHub("Automatic sync: schema catalogue updated");
      if (result.ok) toastFn("success", "Schema changes synchronized automatically to the repository.");
      else if (result.requiresPullFirst) toastFn("warning", 'Automatic sync paused \u2014 a newer version exists remotely. Use "Sync Now" to resolve.');
      else toastFn("error", `Automatic sync failed: ${result.error || "unknown error"}.`);
    }, PUSH_DEBOUNCE_MS);
  }
  async function performDiscovery(reason) {
    if (!secretVaultService.isUnlocked()) return;
    const result = await syncService.pullRegistryFromGitHub();
    if (result.ok) {
      if (result.newSchemasAdded.length) toastFn("success", `${result.newSchemasAdded.length} schema(s) synchronized from the repository: ${result.newSchemasAdded.join(", ")}.`);
      if (result.updatedSchemas.length) toastFn("info", `${result.updatedSchemas.length} schema(s) updated from a newer copy on the repository: ${result.updatedSchemas.join(", ")}.`);
      if (result.conflicts.length) toastFn("warning", `${result.conflicts.length} schema(s) have unresolved sync conflicts \u2014 review them in Schema or Settings.`);
    }
  }
  var performBackgroundPull = performDiscovery;
  async function performPublicDiscovery(reason) {
    const result = await syncService.discoverPublicRegistry(reason);
    if (result.ok) {
      if (result.newSchemasAdded.length) toastFn("success", `${result.newSchemasAdded.length} new schema(s) discovered and synchronized from the repository: ${result.newSchemasAdded.join(", ")}.`);
      if (result.updatedSchemas.length) toastFn("info", `${result.updatedSchemas.length} schema(s) refreshed from a newer copy on the repository: ${result.updatedSchemas.join(", ")}.`);
    }
  }

  // src/engines/optimizeEngine.ts
  function optimizeSuggestions(state) {
    const tips = [];
    if (state.selectedColumns.length === 0) tips.push("You are selecting every column (SELECT *). List only the columns you need to reduce network and memory cost.");
    state.filters.filter((f) => f.operator === "LIKE" || f.operator === "NOT LIKE").forEach((f) => {
      if (f.value.trim().startsWith("%")) tips.push(`The LIKE filter on ${f.table}.${f.column} starts with "%", which prevents an index range scan.`);
    });
    if (state.joins.length + state.selectedTables.length - 1 >= 2 && state.filters.length === 0) tips.push("Multiple joins with no WHERE filter can return very large result sets.");
    if (state.advanced.limit === null && state.sorts.length === 0) tips.push("No result limit or ORDER BY is set \u2014 add one to keep results manageable.");
    if (state.filters.some((f) => f.operator === "IN" && f.value.split(",").length > 50)) tips.push("One of your IN filters has a large number of literal values.");
    if (state.advanced.recursive) tips.push("Recursive hierarchy walks can be expensive on deep trees.");
    if (state.advanced.groupByColumns.length > 0 && !state.advanced.havingClause.trim() && state.selectedColumns.some((c) => c.aggregate)) tips.push("You are aggregating with GROUP BY but have no HAVING clause.");
    if (tips.length === 0) tips.push("No obvious optimization issues detected for this query shape.");
    return tips;
  }

  // src/components/conflictBanner.ts
  function renderConflictBanner(container, onResolved) {
    function draw() {
      const conflicts = syncService.getPendingConflicts();
      if (conflicts.length === 0) {
        container.innerHTML = "";
        return;
      }
      container.innerHTML = `<div class="conflict-banner-wrap"><div class="conflict-banner-head">${icon("shield-alert", 16)} ${conflicts.length} unresolved synchronization conflict${conflicts.length > 1 ? "s" : ""}</div>${conflicts.map((c) => `<div class="conflict-card"><div class="conflict-card-head">${icon("shield-alert", 15)} ${c.schemaName}</div><div class="hint">Local version: ${c.localVersion} \xB7 Remote version: ${c.remoteVersion} \xB7 Detected: ${new Date(c.detectedAt).toLocaleString()}</div><div class="hint">Changed: ${c.changedPaths.slice(0, 6).join(", ")}${c.changedPaths.length > 6 ? ` and ${c.changedPaths.length - 6} more\u2026` : ""}</div><div class="row-actions"><button type="button" class="btn btn-outline btn-sm conflict-use-local" data-conflict-id="${c.id}">Use Local (keep my changes)</button><button type="button" class="btn btn-primary btn-sm conflict-use-remote" data-conflict-id="${c.id}">Use Remote (apply theirs)</button></div></div>`).join("")}</div>`;
      container.querySelectorAll(".conflict-use-local").forEach((btn) => {
        btn.addEventListener("click", () => {
          syncService.resolvePendingConflict(btn.dataset.conflictId, "local");
          store.pushToast("info", "Kept the local version \u2014 the repository will be updated on the next sync.");
          draw();
          onResolved?.();
        });
      });
      container.querySelectorAll(".conflict-use-remote").forEach((btn) => {
        btn.addEventListener("click", () => {
          syncService.resolvePendingConflict(btn.dataset.conflictId, "remote");
          store.pushToast("success", "Applied the remote version.");
          draw();
          onResolved?.();
        });
      });
    }
    const unsubscribe = syncService.subscribe(draw);
    draw();
    container._cleanup = () => unsubscribe();
  }

  // src/services/passwordService.ts
  var STORAGE_KEY2 = "sqla.pwvault.v15";
  var MARKER = "sqla-verified-marker-v15";
  var DEFAULT_PASSWORD = "admin";
  var defaultBlobCache = null;
  async function getStoredBlobRaw() {
    const stored = localStorage.getItem(STORAGE_KEY2);
    if (stored) return stored;
    if (!defaultBlobCache) {
      const blob = await encryptWithSecret(DEFAULT_PASSWORD, MARKER);
      defaultBlobCache = serializeBlob(blob);
    }
    return defaultBlobCache;
  }
  async function verifyPassword(candidate) {
    const raw = await getStoredBlobRaw();
    const blob = deserializeBlob(raw);
    if (!blob) return false;
    const decrypted = await decryptWithSecret(candidate, blob);
    return decrypted === MARKER;
  }
  async function changePassword(oldPassword, newPassword) {
    if (!newPassword || newPassword.trim().length < 4) return { ok: false, error: "New password must be at least 4 characters." };
    const isValid = await verifyPassword(oldPassword);
    if (!isValid) return { ok: false, error: "Current password is incorrect." };
    const newBlob = await encryptWithSecret(newPassword, MARKER);
    const result = safeLocalStorageSet(STORAGE_KEY2, serializeBlob(newBlob));
    if (!result.ok) return { ok: false, error: result.error };
    return { ok: true };
  }
  function resetPasswordToDefault() {
    localStorage.removeItem(STORAGE_KEY2);
  }

  function renderDataTable(container, opts) {
    const pageSize = opts.pageSize ?? 50;
    let allRows = opts.rows;
    let searchTerm = opts.initialSearch || "";
    let sortKey = null;
    let sortDir = "asc";
    let page = 0;
    let selectedId = opts.selectedRowId ?? null;
    function filteredSortedRows() {
      let rows = allRows;
      if (searchTerm) rows = rows.filter((r) => opts.searchPredicate?.(r, searchTerm.toLowerCase()));
      if (sortKey) {
        const col = opts.columns.find((c) => c.key === sortKey);
        if (col?.sortValue) rows = [...rows].sort((a, b) => {
          const av = col.sortValue(a);
          const bv = col.sortValue(b);
          const cmp = av < bv ? -1 : av > bv ? 1 : 0;
          return sortDir === "asc" ? cmp : -cmp;
        });
      }
      return rows;
    }
    function renderBodyAndPagination() {
      const tbody = container.querySelector("tbody");
      const paginationLabel = container.querySelector(".dt-page-label");
      const countEl = container.querySelector(".data-table-count");
      const prevBtn = container.querySelector("#dtPrevBtn");
      const nextBtn = container.querySelector("#dtNextBtn");
      const theadRow = container.querySelector("thead tr");
      if (!tbody) return;
      const filtered = filteredSortedRows();
      const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
      page = Math.min(page, totalPages - 1);
      const pageRows = filtered.slice(page * pageSize, page * pageSize + pageSize);
      tbody.innerHTML = pageRows.length ? pageRows.map((row) => {
        const rid = opts.getRowId(row);
        return `<tr data-row-id="${rid}" class="${rid === selectedId ? "is-selected" : ""}">${opts.columns.map((c) => `<td>${c.render ? c.render(row) : String(row[c.key] ?? "")}</td>`).join("")}</tr>`;
      }).join("") : `<tr><td colspan="${opts.columns.length}" class="data-table-empty">${opts.emptyMessage || "No rows found."}</td></tr>`;
      if (countEl) countEl.textContent = `${filtered.length} row(s)${searchTerm ? ` matching "${searchTerm}"` : ""}`;
      if (paginationLabel) paginationLabel.textContent = `Page ${page + 1} of ${totalPages}`;
      if (prevBtn) prevBtn.disabled = page === 0;
      if (nextBtn) nextBtn.disabled = page >= totalPages - 1;
      tbody.querySelectorAll("tr[data-row-id]").forEach((tr) => {
        tr.addEventListener("click", () => {
          const rid = tr.dataset.rowId;
          selectedId = rid;
          const row = allRows.find((r) => opts.getRowId(r) === rid);
          if (row) opts.onRowClick?.(row);
          renderBodyAndPagination();
        });
      });
    }
    function renderShellOnce() {
      container.innerHTML = `<div class="data-table-toolbar">${icon("search", 14)}<input type="text" class="data-table-search" placeholder="Search..."/><span class="data-table-count"></span></div><div class="data-table-scroll-wrap"><table class="data-table"><thead><tr>${opts.columns.map((c) => `<th class="sortable" data-key="${c.key}" data-label="${c.label}">${c.label}</th>`).join("")}</tr></thead><tbody></tbody></table></div><div class="data-table-pagination"><button id="dtPrevBtn" class="btn btn-ghost btn-sm" type="button">${icon("chevron-left", 14)} Prev</button><span class="dt-page-label"></span><button id="dtNextBtn" class="btn btn-ghost btn-sm" type="button">Next ${icon("chevron-right", 14)}</button></div>`;
      const searchInput = container.querySelector(".data-table-search");
      searchInput.value = searchTerm;
      searchInput.addEventListener("input", (e) => {
        searchTerm = e.target.value;
        page = 0;
        renderBodyAndPagination();
      });
      container.querySelectorAll("th.sortable").forEach((th) => {
        th.addEventListener("click", () => {
          const key = th.dataset.key;
          if (sortKey === key) sortDir = sortDir === "asc" ? "desc" : "asc";
          else {
            sortKey = key;
            sortDir = "asc";
          }
          renderBodyAndPagination();
        });
      });
      container.querySelector("#dtPrevBtn")?.addEventListener("click", () => {
        page = Math.max(0, page - 1);
        renderBodyAndPagination();
      });
      container.querySelector("#dtNextBtn")?.addEventListener("click", () => {
        const filtered = filteredSortedRows();
        const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));
        page = Math.min(totalPages - 1, page + 1);
        renderBodyAndPagination();
      });
      renderBodyAndPagination();
    }
    renderShellOnce();
    return { refresh: (rows) => {
      allRows = rows;
      renderBodyAndPagination();
    }, getSelectedId: () => selectedId, setSearch: (term) => {
      searchTerm = term;
      const input = container.querySelector(".data-table-search");
      if (input) input.value = term;
      page = 0;
      renderBodyAndPagination();
    } };
  }

      const modal1 = openModal(`${icon("alert-triangle", 18)} Confirm Delete`, `<p>Are you sure you want to delete this schema record?</p><div class="modal-actions"><button id="c1Cancel" class="btn btn-ghost">Cancel</button><button id="c1Continue" class="btn btn-danger">Continue</button></div>`);
      modal1.element.querySelector("#c1Cancel")?.addEventListener("click", () => modal1.close());
      modal1.element.querySelector("#c1Continue")?.addEventListener("click", () => {
        modal1.close();
        showConfirm2();
      });
      function showConfirm2() {
        const modal2 = openModal(`${icon("alert-triangle", 18)} Confirm Details`, `<p>You are about to permanently delete:</p><ul><li>Schema: ${schema.name}</li><li>Table: ${row.tableName}</li><li>Column: ${row.columnName}</li></ul><p>This change will modify the selected schema.</p><p>Do you want to continue?</p><div class="modal-actions"><button id="c2Cancel" class="btn btn-ghost">Cancel</button><button id="c2Continue" class="btn btn-danger">Continue</button></div>`);
        modal2.element.querySelector("#c2Cancel")?.addEventListener("click", () => modal2.close());
        modal2.element.querySelector("#c2Continue")?.addEventListener("click", () => {
          modal2.close();
          showConfirm3();
        });
      }
      function showConfirm3() {
        const modal3 = openModal(`${icon("lock", 18)} Final Confirmation`, `<p>Enter the Admin Password to permanently delete this schema record.</p><label class="block-label">Admin Password<input id="c3Password" type="password"/></label><div id="c3Error" class="issue-box mini" hidden>Incorrect password.</div><div class="modal-actions"><button id="c3Cancel" class="btn btn-ghost">Cancel</button><button id="c3Delete" class="btn btn-danger">Delete Permanently</button></div>`, { closeOnBackdrop: false });
        modal3.element.querySelector("#c3Cancel")?.addEventListener("click", () => modal3.close());
        modal3.element.querySelector("#c3Delete")?.addEventListener("click", async () => {
          const pwInput = modal3.element.querySelector("#c3Password");
          const errBox = modal3.element.querySelector("#c3Error");
          const ok = await verifyPassword(pwInput.value);
          if (!ok) {
            errBox.removeAttribute("hidden");
            return;
          }
          const result = await schemaService.deleteRow(schemaId, row.rowId);
          modal3.close();
          if (result.ok) {
            store.pushToast("success", `Deleted ${row.tableName}.${row.columnName}.`);
            refreshTable();
          } else store.pushToast("error", result.error || "Delete failed.");
        });
      }
    }
    draw();
  }

  // src/components/syncLogPanel.ts
  function renderSyncLogPanel(container) {
    function draw() {
      const entries = syncService.getSyncLog();
      if (entries.length === 0) {
        container.innerHTML = `<p class="hint">No synchronization activity yet.</p>`;
        return;
      }
      container.innerHTML = `<div class="sync-log-list">${entries.map((e) => {
        const iconName = e.kind === "error" ? "alert-triangle" : e.kind === "push" ? "upload" : e.kind === "pull" ? "download" : e.kind === "suppressed" ? "shield" : "folder-sync";
        return `<div class="sync-log-row ${e.kind === "error" ? "sync-log-error" : ""}">${icon(iconName, 13)}<span class="sync-log-time">${new Date(e.timestamp).toLocaleTimeString()}</span><span class="sync-log-msg">${e.message}</span></div>`;
      }).join("")}</div>`;
    }
    const unsubscribe = syncService.subscribe(draw);
    draw();
    container._cleanup = () => unsubscribe();
  }

        const mount = panel.querySelector("#cleanupResult");
        if (mount) mount.innerHTML = `<div class="issue-box ok mini">${icon("check", 14)} Removed ${result.removedCount} duplicate/stale schema(s), freeing approximately ${formatBytes(result.freedApproxBytes)}.</div>`;
        store.pushToast("success", `Storage cleanup complete \u2014 removed ${result.removedCount} schema(s).`);
        renderDangerTab(panel);
      });
      panel.querySelector("#wipeSchemaBtn")?.addEventListener("click", () => {
        const wipeResult = panel.querySelector("#wipeResult");
        if (!wipeResult) return;
        wipeResult.innerHTML = `<div class="issue-box warn mini">${icon("alert-triangle", 14)} This will permanently remove ALL tables/columns from the active schema. Enter the Admin Password to confirm.</div><label class="block-label">Admin Password<input type="password" id="wipePwInput"/></label><div class="row-actions"><button id="wipeCancelBtn" class="btn btn-ghost btn-sm" type="button">Cancel</button><button id="wipeConfirmBtn" class="btn btn-danger btn-sm" type="button">${icon("trash", 14)} Confirm Delete</button></div>`;
        panel.querySelector("#wipeCancelBtn")?.addEventListener("click", () => {
          wipeResult.innerHTML = "";
        });
        panel.querySelector("#wipeConfirmBtn")?.addEventListener("click", async () => {
          const pw = panel.querySelector("#wipePwInput")?.value || "";
          const ok = await verifyPassword(pw);
          if (!ok) {
            wipeResult.innerHTML = `<div class="issue-box mini">${icon("alert-triangle", 14)} Incorrect password.</div>`;
            return;
          }
          const active2 = schemaService.getActiveSchema();
          const backup = schemaService.deleteAllSchemaContents(active2.id);
          downloadBlob(`schema-backup-${active2.id}-${Date.now()}.json`, backup, "application/json");
          store.pushToast("success", "Schema contents deleted. A backup was downloaded automatically.");
          wipeResult.innerHTML = "";
          renderDangerTab(panel);
        });
      });
    }
    draw();
  }

  // src/pages/aboutPage.ts
  function renderAboutPage(container) {
    container.innerHTML = `<div class="page" data-tour="about-panel"><h1 class="page-title">${icon("info")} About AP-SQL Assistant</h1><p>AP-SQL Assistant is a self-contained tool that helps support teams construct accurate SQL without needing deep, memorized knowledge of the underlying database schema.</p><p>Packaged as a single self-contained HTML file (CSS and JavaScript bundled with esbuild) \u2014 so it works identically whether opened directly by double-click (file://) or served over http/https.</p>
  <h3 class="section-title">M365 Copilot Enterprise Integration</h3>
  <p>Describe What You Need can optionally use your organization's M365 Copilot Enterprise agent to help interpret natural-language requests, using Microsoft's standard identity-platform sign-in (no stored passwords or hard-coded credentials). It is off by default: nothing changes until an administrator configures it in Settings \u2192 Secret Vault. Whenever it is used, the offline engine still resolves the final SQL against your Active Schema \u2014 Copilot can never introduce a table or column that isn't already in your schema, and it cannot modify the schema itself. If Copilot is unavailable, unreachable, or not configured, the app falls back to the existing offline engine automatically.</p>
  <h3 class="section-title">V16.1 \u2014 Regression fixes</h3>
  <p>This release restores the previously approved card sizing/spacing, permanently fixes a GitHub synchronization issue that could reject a validly imported schema with "Remote schema file failed validation", and ensures the sync error indicator is hidden whenever there is no active error and clears itself the moment a later synchronization succeeds.</p>
  <h3 class="section-title">Fix \u2014 Storage quota exceeded</h3>
  <p>Every localStorage write goes through a hardened <code>safeLocalStorageSet()</code> helper that automatically prunes duplicate/stale schemas and retries on quota errors.</p>
  <h3 class="section-title">Fix \u2014 Cross-device schema sync gap</h3>
  <p>The app performs an automatic, read-only, unauthenticated discovery pull on every app load.</p>
  <h3 class="section-title">Fix \u2014 Blank page on double-click</h3>
  <p>The app is bundled into a single plain (non-module) script embedded directly in the HTML, which works fully over the <code>file://</code> protocol.</p>
  <p class="hint">Current AI provider: ${aiService.providerName} (${aiService.isAvailable ? "available" : "unavailable"}).</p>
  <p class="hint">Strictly a SQL-text generator \u2014 never opens a database connection, never executes a query. Manual Schema Update's delete requires three confirmations, the last requiring the Admin Password; the GitHub access token and any M365 Copilot Enterprise credentials live only as encrypted ciphertext, always shown masked in the UI.</p>
  <p class="hint">Crafted by Subham Ain \xB7 Senior Support Consultant</p></div>`;
  }

  // src/components/tourOverlay.ts
  var WALKTHROUGH_STEPS = [
    { id: "w1", route: "quickstart", targetSelector: '[data-tour="brand"]', title: "Welcome to SQL Assistant", body: "This tool writes read-only and Change Request SQL for you, using your organization's active schema as the single source of truth. Select the logo any time to return here." },
    { id: "w2", route: "quickstart", targetSelector: '[data-tour="hamburger-btn"]', title: "Hamburger Menu", body: "All page navigation lives behind this button on the left of the navbar." },
    { id: "w3", route: "quickstart", targetSelector: '[data-tour="navbar-sync"]', title: "Sync Source & Sync Time", body: "Schema synchronization is fully automatic once the Secret Vault is unlocked \u2014 these dropdowns control WHERE and HOW OFTEN background pulls happen." },
    { id: "w4", route: "readonly", targetSelector: '[data-tour="describe-card"]', title: "Describe What You Need", body: "Describe a requirement in plain language. If your organization has configured M365 Copilot Enterprise, it assists with interpreting your request \u2014 either way, your Active Schema always has the final say over the SQL that is generated." },
    { id: "w5", route: "readonly", targetSelector: '[data-tour="module-selector"]', title: "Module \u2192 Search \u2192 Select", body: "Narrow the table list by Module, then search." },
    { id: "w6", route: "readonly", targetSelector: '[data-tour="tab-tables-columns"]', title: "Select Columns \u2014 Search + Select All", body: '"Select All" always selects every column for the selected table(s) regardless of the search filter.' },
    { id: "w7", route: "readonly", targetSelector: '[data-tour="tab-advanced"]', title: "Advanced Options", body: "Automatic Joins, WITH/CTEs, GROUP BY, HAVING, ORDER BY, LIMIT, DISTINCT, aggregates, and manual CASE/DECODE all live here." },
    { id: "w8", route: "cr", targetSelector: '[data-tour="cr-query-type"]', title: "Query Builder for CR", body: "Same layout and stability as Read Only." },
    { id: "w9", route: "schema-used", targetSelector: '[data-tour="schema-module-selector"]', title: "Schema \u2014 Module & Search", body: "Filter Tables (and Views) in the Active Schema." },
    { id: "w10", route: "error-rectifier", targetSelector: '[data-tour="error-rectifier-form"]', title: "Error Rectifier", body: "Paste a database error and the SQL that caused it \u2014 always grounded in the active schema." },
    { id: "w11", route: "settings", targetSelector: '[data-tour="settings-lock-screen"]', title: "Settings is password protected", body: "Enter the Admin Password to unlock Settings \u2014 this automatically unlocks the Secret Vault and starts synchronizing schemas in the background." },
    { id: "w12", route: "about", targetSelector: '[data-tour="about-panel"]', title: "About", body: "Version history and architecture notes for SQL Assistant." }
  ];
  var GuidedTour = class {
    constructor(navigate, steps = WALKTHROUGH_STEPS) {
      __publicField(this, "index", 0);
      __publicField(this, "overlay");
      __publicField(this, "navigate");
      __publicField(this, "steps");
      this.navigate = navigate;
      this.steps = steps;
    }
    start() {
      this.index = 0;
      this.showStep();
    }
    cleanup() {
      this.overlay?.remove();
      this.overlay = void 0;
    }
    exit() {
      this.cleanup();
      store.markWalkthroughSeen();
    }
    showStep() {
      const step = this.steps[this.index];
      if (!step) {
        this.exit();
        return;
      }
      if (store.route !== step.route) this.navigate(step.route);
      const needsMenuOpen = step.targetSelector.includes("hamburger-panel") || step.id === "w2";
      if (needsMenuOpen) {
        const toggler = document.querySelector("#navToggle");
        if (toggler && toggler.getAttribute("aria-expanded") !== "true") toggler.click();
      }
      requestAnimationFrame(() => requestAnimationFrame(() => this.render(step)));
    }
    render(step) {
      this.cleanup();
      const target = document.querySelector(step.targetSelector);
      const overlay = document.createElement("div");
      overlay.className = "tour-overlay";
      const rect = target?.getBoundingClientRect();
      const spotlightStyle = rect ? `top:${Math.max(4, rect.top - 6)}px;left:${Math.max(4, rect.left - 6)}px;width:${rect.width + 12}px;height:${rect.height + 12}px;` : "display:none;";
      let popupTop = rect ? rect.bottom + 16 : window.innerHeight / 2 - 100;
      const popupWidth = Math.min(420, window.innerWidth - 32);
      let popupLeft = rect ? Math.min(Math.max(16, rect.left), window.innerWidth - popupWidth - 16) : (window.innerWidth - popupWidth) / 2;
      if (popupTop + 220 > window.innerHeight) popupTop = Math.max(16, (rect?.top || window.innerHeight / 2) - 236);
      const dots = this.steps.map((_, i) => `<span class="tour-dot ${i === this.index ? "active" : ""}"></span>`).join("");
      overlay.innerHTML = `<div class="tour-spotlight" style="${spotlightStyle}"></div><div class="tour-popup" style="top:${popupTop}px; left:${popupLeft}px; width:${popupWidth}px;"><div class="tour-step-label">Step ${this.index + 1} of ${this.steps.length}</div><h4>${step.title}</h4><p>${step.body}</p><div class="tour-dots">${dots}</div><div class="tour-actions"><button id="tourExit" class="btn btn-ghost" type="button">Exit</button><button id="tourSkip" class="btn btn-ghost" type="button">Skip</button><div class="tour-actions-right"><button id="tourPrev" class="btn btn-ghost" type="button" ${this.index === 0 ? "disabled" : ""}>Back</button><button id="tourNext" class="btn btn-primary" type="button">${this.index === this.steps.length - 1 ? "Finish" : "Next"}</button></div></div></div>`;
      document.body.appendChild(overlay);
      this.overlay = overlay;
      if (target) target.scrollIntoView({ behavior: "smooth", block: "center" });
      overlay.querySelector("#tourExit")?.addEventListener("click", () => this.exit());
      overlay.querySelector("#tourSkip")?.addEventListener("click", () => this.exit());
      overlay.querySelector("#tourPrev")?.addEventListener("click", () => {
        this.index = Math.max(0, this.index - 1);
        this.showStep();
      });
      overlay.querySelector("#tourNext")?.addEventListener("click", () => {
        if (this.index === this.steps.length - 1) {
          this.exit();
          return;
        }
        this.index += 1;
        this.showStep();
      });
    }
  };

  // src/layouts/appShell.ts
  var VALID_ROUTES = ["quickstart", "readonly", "cr", "schema-used", "error-rectifier", "settings", "about"];
  var SIGNATURE_NAME = "Subham Ain";
  function mountAppShell(root) {
    root.innerHTML = "";
    const shell = document.createElement("div");
    shell.className = "app-shell";
    const navSlot = document.createElement("div");
    const mainSlot = document.createElement("main");
    mainSlot.className = "app-main";
    shell.appendChild(navSlot);
    shell.appendChild(mainSlot);
    root.appendChild(shell);
    const footer = document.createElement("footer");
    footer.className = "app-footer";
    footer.innerHTML = `<span>AP-SQL Assistant \xB7 Version 16.1.1</span><span>Crafted by ${SIGNATURE_NAME}</span>`;
    root.appendChild(footer);
    mountToastContainer(root);
    setAutoSyncToastHandler((kind, text) => store.pushToast(kind, text));
    initAutoSync();
    performPublicDiscovery("app-load").catch(() => {
    });
    function routeFromHash() {
      const h = window.location.hash.replace("#", "");
      return VALID_ROUTES.includes(h) ? h : "quickstart";
    }
    function navigate(route) {
      window.location.hash = route;
    }
    const tour = new GuidedTour(navigate);
    function renderPage(route) {
      const prev = mainSlot.firstElementChild;
      if (prev && typeof prev._cleanup === "function") prev._cleanup();
      const pageEl = document.createElement("div");
      pageEl.className = "page-mount";
      mainSlot.innerHTML = "";
      mainSlot.appendChild(pageEl);
      switch (route) {
        case "readonly":
          renderReadOnlyBuilderPage(pageEl);
          break;
        case "cr":
          renderCrBuilderPage(pageEl);
          break;
        case "schema-used":
          renderSchemaPage(pageEl);
          break;
        case "error-rectifier":
          renderErrorRectifierPage(pageEl);
          break;
        case "settings":
          renderSettingsPage(pageEl);
          break;
        case "about":
          renderAboutPage(pageEl);
          break;
        case "quickstart":
        default:
          renderQuickstartPage(pageEl, navigate);
          break;
      }
    }
    function renderAll() {
      const route = routeFromHash();
      store.setRoute(route);
      renderPage(route);
    }
    window.addEventListener("hashchange", renderAll);
    let lastKnownSettingsLockState = store.settingsUnlocked;
    store.subscribe(() => {
      if (store.route === "settings" && store.settingsUnlocked !== lastKnownSettingsLockState) {
        lastKnownSettingsLockState = store.settingsUnlocked;
        renderPage("settings");
      }
    });
    renderNavbar(navSlot, navigate, () => tour.start(), SIGNATURE_NAME);
    renderAll();
  }

  // src/main.ts
  function boot() {
    if (handleCopilotAuthCallbackIfPresent()) return;
    initTheme();
    const appRoot = document.getElementById("app");
    if (!appRoot) {
      throw new Error("AP-SQL Assistant: #app root element not found in index.html");
    }
    mountAppShell(appRoot);
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();

  </script>
</body>
